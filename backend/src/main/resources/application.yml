spring:
  application:
    name: tax-platform-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tax_platform}
    username: ${POSTGRES_USER:tax_platform}
    password: ${POSTGRES_PASSWORD:tax_platform_local}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
